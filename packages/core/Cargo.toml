[package]
name = "katmer-core"
version = "0.0.5-alpha.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "katmer"
path = "src/main.rs"

[dependencies]
napi = { version = "2.12.0", optional = true, features = ["napi4", "tokio_rt"] }
napi-derive = { version = "2.12.2", optional = true }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "json",
    "fmt",
] }
toml = "0.9.11"
json5 = "1.3.0"
tera = "1.20.1"
tracing-appender = "0.2.4"
async-trait = "0.1.89"
regex = "1.12.3"
schemars = "1.2.1"
ssh2 = { version = "0.9.5" }
sha2 = "0.10.9"
hex = "0.4.3"
async-ssh2-lite = { version = "0.5.0", features = [
    "openssl-on-win32",
    "tokio",
    "vendored-openssl",
] }
tokio-util = { version = "0.7.18", features = ["compat"] }
futures-util = "0.3.31"
reqwest = { version = "0.12", features = ["json"] }

[build-dependencies]
napi-build = "2"

[features]
default = []
node = ["dep:napi", "dep:napi-derive"]
